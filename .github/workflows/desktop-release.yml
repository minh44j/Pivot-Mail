# Publishes a new version of the Windows app: press "Run workflow" (Actions > Desktop release) after raising "version" in
# desktop/package.json. Builds on Windows, runs the tests, then publishes GitHub Release v<version> with:
#   PivotMail-Setup-<version>.exe   the installer for new computers (link this one for staff)
#   PivotMail-Package-<version>.exe + latest.yml + .blockmap   what installed apps download to update themselves
# Installed apps check every 4 hours (and 30 s after starting), download in the background and install on "Restart now", on quit,
# or by themselves after 20 minutes without keyboard/mouse when the screen is locked or Pivot Mail is not on screen. From "main" only.
name: Desktop release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency: desktop-release

jobs:
  # The Mac app (one .dmg for Apple Silicon and Intel), built and tested on a Mac, then attached to the same release.
  mac:
    runs-on: macos-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Only from the main branch
        shell: bash
        working-directory: .
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then echo "::error::Releases are made from the main branch only (this run: $GITHUB_REF)."; exit 1; fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            web/package-lock.json
      - name: Refuse a version that was already released
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(node -p "require('./package.json').version")
          if gh release view "v$v" >/dev/null 2>&1; then echo "v$v is already released: raise the version in desktop/package.json first."; exit 1; fi
      - run: npm ci
      - name: Build the Mac app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:mac
      - name: Test the Mac app before publishing
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          (cd ../web && npm ci && npm run build)
          npm install --no-save playwright@1.63.0
          (cd ../web && nohup npx tsx ../desktop/test/server.mts > "$GITHUB_WORKSPACE/server.log" 2>&1 &)
          for i in $(seq 1 40); do curl -s -o /dev/null http://localhost:4310/ && break; sleep 1; done
          ELECTRON_RUN_AS_NODE=1 npx electron test/store.test.cjs
          PIVOT_MAIL_EXE="$PWD/release/mac-universal/Pivot Mail.app/Contents/MacOS/Pivot Mail" node test/e2e.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: mac-dmg
          path: desktop/release/PivotMail-*-mac.dmg
          retention-days: 3
          compression-level: 0

  release:
    needs: mac
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      # Only from "main": staff computers install whatever is released, so it must be the reviewed, merged code
      # (not a working branch). Choose "main" in the "Use workflow from" list when pressing Run workflow.
      - name: Only from the main branch
        shell: bash
        working-directory: .
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then echo "::error::Releases are made from the main branch only (this run: $GITHUB_REF)."; exit 1; fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            web/package-lock.json
      - run: npm ci
      - name: Refuse a version that was already released
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(node -p "require('./package.json').version")
          if gh release view "v$v" >/dev/null 2>&1; then echo "v$v is already released: raise the version in desktop/package.json first."; exit 1; fi
      - name: Build the package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist
      - name: Build Pivot Mail Setup
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          du -sb release/win-unpacked | cut -f1 > release/expected-bytes.txt
          dotnet build setup/PivotMailSetup.csproj -c Release -nologo -p:Version=$v -p:PayloadPath=../release/PivotMail-Package-$v.exe -p:ExpectedBytesPath=../release/expected-bytes.txt
          cp setup/bin/Release/net462/PivotMailSetup.exe "release/PivotMail-Setup-$v.exe"
      - name: Test the packaged app before publishing
        shell: bash
        run: |
          (cd ../web && npm ci && npm run build)
          npm install --no-save playwright@1.63.0
          (cd ../web && nohup npx tsx ../desktop/test/server.mts > "$GITHUB_WORKSPACE/server.log" 2>&1 &)
          for i in $(seq 1 40); do curl -s -o /dev/null http://localhost:4310/ && break; sleep 1; done
          ELECTRON_RUN_AS_NODE=1 npx electron test/store.test.cjs
          PIVOT_MAIL_EXE="release/win-unpacked/Pivot Mail.exe" node test/e2e.cjs
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Check the update files exist
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          for f in "release/latest.yml" "release/PivotMail-Package-$v.exe.blockmap" "release/win-unpacked/resources/app-update.yml"; do
            test -s "$f" || { echo "missing $f: installed copies could not update"; exit 1; }
          done
          grep -q "version: $v" release/latest.yml
      - name: Fetch the Mac app
        uses: actions/download-artifact@v4
        with:
          name: mac-dmg
          path: desktop/release
      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(node -p "require('./package.json').version")
          # Fixed-name copies too: the website's "Download for Windows / Mac" buttons link to
          # releases/latest/download/PivotMail-Setup.exe and PivotMail-mac.dmg, which always give the newest version.
          cp "release/PivotMail-Setup-$v.exe" release/PivotMail-Setup.exe
          cp "release/PivotMail-$v-mac.dmg" release/PivotMail-mac.dmg
          # --target: the tag points at exactly the commit that was built and tested above.
          gh release create "v$v" --target "$GITHUB_SHA" --title "Pivot Mail $v (Windows and Mac)" --notes "Windows: download PivotMail-Setup-$v.exe and double-click it; installed copies update themselves. Mac: download PivotMail-$v-mac.dmg, open it and drag Pivot Mail to Applications (first time: System Settings > Privacy & Security > Open Anyway)." \
            "release/PivotMail-Setup-$v.exe" "release/PivotMail-Package-$v.exe" "release/PivotMail-Package-$v.exe.blockmap" "release/latest.yml" "release/PivotMail-$v-mac.dmg" release/PivotMail-Setup.exe release/PivotMail-mac.dmg
