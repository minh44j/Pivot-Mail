# Shows what installing Pivot Mail looks like: builds Pivot Mail Setup, runs it on a real Windows machine pressing Enter like a
# person, photographs every screen, and saves the photos to desktop/installer-preview/ on this branch.
name: Installer preview (screenshots)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/installer-preview.yml'
      - 'desktop/setup/**'
      - 'desktop/test/installer-shots.ps1'

permissions:
  contents: write

jobs:
  shots:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            web/package-lock.json
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Package and Setup
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm run dist
          v=$(node -p "require('./package.json').version")
          du -sb release/win-unpacked | cut -f1 > release/expected-bytes.txt
          dotnet build setup/PivotMailSetup.csproj -c Release -nologo -p:Version=$v -p:PayloadPath=../release/PivotMail-Package-$v.exe -p:ExpectedBytesPath=../release/expected-bytes.txt
          cp setup/bin/Release/net48/PivotMailSetup.exe "release/PivotMail-Setup-$v.exe"
      - name: Run Setup and photograph it
        shell: pwsh
        run: |
          $v = (Get-Content package.json | ConvertFrom-Json).version
          $out = Join-Path (Get-Location) 'installer-preview'
          Remove-Item -Recurse -Force $out -ErrorAction SilentlyContinue
          ./test/installer-shots.ps1 -Installer "release/PivotMail-Setup-$v.exe" -Out $out -KeepInstalled
      - name: Real new-mail alerts from the installed app
        shell: bash
        run: |
          (cd ../web && npm ci && npm run build)
          npm install --no-save playwright@1.63.0
          (cd ../web && nohup npx tsx ../desktop/test/server.mts > "$GITHUB_WORKSPACE/server.log" 2>&1 &)
          for i in $(seq 1 40); do curl -s -o /dev/null http://localhost:4310/ && break; sleep 1; done
          PIVOT_MAIL_EXE="$LOCALAPPDATA/Programs/pivot-mail-desktop/Pivot Mail.exe" PIVOT_MAIL_SHOTS="$(cygpath -w "$PWD/installer-preview")" node test/e2e.cjs || true
          "$LOCALAPPDATA/Programs/pivot-mail-desktop/Uninstall Pivot Mail.exe" /S || true
          ls -la installer-preview
      - name: Save the photos on this branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add installer-preview
          git commit -m "Installer preview screenshots [skip ci]" || exit 0
          for i in 1 2 3 4; do git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && break; sleep 5; done
