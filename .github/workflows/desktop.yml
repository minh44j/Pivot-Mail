# Builds the Pivot Mail Windows installer on a Windows machine, then tests the packaged app itself on that Windows machine
# (sign-in hand-off, alerts, tray, taskbar number, drag-out, the local mail database and search). The installer is attached to
# the run as "PivotMail-Windows" only when every test passed (download it from the run's summary page).
# Runs when the desktop app or the web app changes, or by hand (Actions > Desktop app (Windows) > Run workflow).
name: Desktop app (Windows)

on:
  workflow_dispatch:
  push:
    paths:
      - 'desktop/**'
      - 'web/src/**'
      - 'web/api/**'
      - 'web/public/**'
      - '.github/workflows/desktop.yml'

permissions:
  contents: read

jobs:
  build:
    # Tested on a Windows 10-class machine (Server 2022 shares Windows 10's code base) and a Windows 11-class one (Server 2025).
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            web/package-lock.json
      - run: npm ci
      - run: npm run dist
        env:
          # No code-signing certificate yet: Windows shows "Windows protected your PC" on first run (More info > Run anyway).
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      # ---- tests on Windows, against the packaged app
      - name: Build Pivot Mail Setup (the installer people double-click)
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          du -sb release/win-unpacked | cut -f1 > release/expected-bytes.txt
          dotnet build setup/PivotMailSetup.csproj -c Release -nologo -p:Version=$v -p:PayloadPath=../release/PivotMail-Package-$v.exe -p:ExpectedBytesPath=../release/expected-bytes.txt
          cp setup/bin/Release/net462/PivotMailSetup.exe "release/PivotMail-Setup-$v.exe"
          ls -la release/*.exe
      - name: Web app for the test (built from this commit)
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Test tool (drives the app window)
        run: npm install --no-save playwright@1.63.0
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Test the packaged app on Windows
        shell: bash
        run: |
          # The real sign-in code with a pretend Google, serving the web app (started here so it lives through the tests)
          (cd ../web && nohup npx tsx ../desktop/test/server.mts > "$GITHUB_WORKSPACE/server.log" 2>&1 &)
          for i in $(seq 1 40); do curl -s -o /dev/null http://localhost:4310/ && break; sleep 1; done
          echo "== local mail database: search accuracy, wipe, 50,000-message speed"
          ELECTRON_RUN_AS_NODE=1 npx electron test/store.test.cjs
          echo "== the packaged app, end to end"
          PIVOT_MAIL_EXE="release/win-unpacked/Pivot Mail.exe" node test/e2e.cjs
      - name: Install with Setup on Windows, check everything, uninstall
        shell: pwsh
        run: |
          $v = (Get-Content package.json | ConvertFrom-Json).version
          $p = Start-Process -FilePath "release/PivotMail-Setup-$v.exe" -ArgumentList '/silent' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Setup ended with code $($p.ExitCode)" }
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\pivot-mail-desktop'
          $exe = Join-Path $dir 'Pivot Mail.exe'
          $lnk = Join-Path ([Environment]::GetFolderPath('Desktop')) 'Pivot Mail.lnk'
          $runKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'
          if (!(Test-Path $exe)) { throw 'Pivot Mail was not installed' }; 'PASS installed for this person (no administrator rights)'
          if (!(Get-ChildItem (Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs') -Recurse -Filter 'Pivot Mail.lnk')) { throw 'no Start menu entry' }; 'PASS Start menu entry'
          if (!(Test-Path $lnk)) { throw 'no desktop shortcut' }; 'PASS desktop shortcut'
          $run = (Get-ItemProperty $runKey -ErrorAction SilentlyContinue).'com.pivot.mail'
          if (-not $run -or $run -notlike '*--hidden*') { throw "not set to run at startup ($run)" }; 'PASS runs at startup (quietly, in the tray)'
          $set = Get-Content (Join-Path $env:APPDATA 'Pivot Mail\settings.json') -Raw
          if ($set -notmatch '"startWithWindows":\s*true') { throw "setting not recorded: $set" }; 'PASS the app''s own setting agrees (tray tick)'
          Start-Process (Join-Path $dir 'Uninstall Pivot Mail.exe') -ArgumentList '/S' -Wait
          Start-Sleep -Seconds 4
          if (Test-Path $exe) { throw 'uninstall left the app behind' }
          if (Test-Path $lnk) { throw 'uninstall left the desktop shortcut' }
          if ((Get-ItemProperty $runKey -ErrorAction SilentlyContinue).'com.pivot.mail') { throw 'uninstall left the startup entry' }
          'PASS uninstall removes the app, the desktop shortcut and the startup entry'
      - name: Test server log (on failure)
        if: failure()
        shell: bash
        run: cat "$GITHUB_WORKSPACE/server.log" || true
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'windows-latest'
        with:
          name: PivotMail-Windows
          path: desktop/release/PivotMail-Setup-*.exe
          if-no-files-found: error
          retention-days: 30
