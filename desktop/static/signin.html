<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'self'; script-src 'self'" />
    <title>Pivot Mail</title>
    <link rel="stylesheet" href="signin.css" />
  </head>
  <body>
    <main>
      <header class="brand">
        <img src="../build/icon.png" width="64" height="64" alt="" />
        <span class="word"><b>Pivot</b> Mail</span>
      </header>

      <!-- choose: the two sign-in buttons -->
      <section id="choose" class="pane">
        <h1>Sign in</h1>
        <p class="lead">Use your Pivot work account.</p>
        <div id="error" class="error" role="alert" hidden><b id="error-title"></b><span id="error-text"></span></div>
        <button type="button" class="google" data-co="scl"><svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true" focusable="false"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.4c-.5 2.9-2.2 5.3-4.6 6.9l7.1 5.5c4.3-4 6.8-9.9 6.8-16.9z"/><path fill="#FBBC05" d="M10.5 28.7c-.5-1.4-.8-2.9-.8-4.7s.3-3.2.8-4.7l-7.9-6.1C.9 16.5 0 20.1 0 24s.9 7.5 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.1-5.5c-2 1.4-4.6 2.3-8.8 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg><span><b>Pivot Shipping</b><small>@pivotscl.com</small></span></button>
        <button type="button" class="google" data-co="tmc"><svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true" focusable="false"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.4c-.5 2.9-2.2 5.3-4.6 6.9l7.1 5.5c4.3-4 6.8-9.9 6.8-16.9z"/><path fill="#FBBC05" d="M10.5 28.7c-.5-1.4-.8-2.9-.8-4.7s.3-3.2.8-4.7l-7.9-6.1C.9 16.5 0 20.1 0 24s.9 7.5 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.1-5.5c-2 1.4-4.6 2.3-8.8 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg><span><b>Pivot Travel Management</b><small>@pivottmc.com</small></span></button>
      </section>

      <!-- waiting: Google is open in the browser -->
      <section id="waiting" class="pane" hidden>
        <div class="spin" aria-hidden="true"></div>
        <h1>Continue in your browser</h1>
        <p class="lead">We opened Google in your browser. Choose your <b id="domain">@pivotscl.com</b> account there. Pivot Mail opens here by itself.</p>
        <button type="button" class="secondary" id="reopen">Open the browser again</button>
        <button type="button" class="link" id="back">Back</button>
      </section>

      <footer><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg><span>Encrypted · Internal use only</span></footer>
    </main>
    <script src="signin.js"></script>
  </body>
</html>
