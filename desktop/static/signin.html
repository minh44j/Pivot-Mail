<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'self'; script-src 'self'" />
    <title>Pivot Mail</title>
    <link rel="stylesheet" href="signin.css" />
  </head>
  <body>
    <div class="hero" aria-hidden="true">
      <span class="glow g1"></span><span class="glow g2"></span><span class="glow g3"></span>
      <span class="dots"></span>
    </div>
    <header class="brand">
      <span class="logo"><img src="../build/icon.png" width="76" height="76" alt="" /></span>
      <span class="word"><b>Pivot</b> Mail</span>
    </header>

    <main class="sheet">
      <!-- choose: the two sign-in buttons -->
      <section id="choose" class="pane">
        <h1 class="rise r1">Welcome back</h1>
        <p class="lead rise r2">Sign in with your Pivot work account.</p>
        <div id="error" class="error rise" role="alert" hidden>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5v.01"/></svg>
          <span><b id="error-title"></b><span id="error-text"></span></span>
        </div>
        <button type="button" class="co rise r3" data-co="scl">
          <span class="tile scl"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 15l1.6 4.2a2 2 0 0 0 1.9 1.3h11a2 2 0 0 0 1.9-1.3L21 15H3z"/><path d="M5 15V9h14v6"/><path d="M9 9V5h6v4"/><path d="M12 5V3"/></svg></span>
          <span class="txt"><b>Pivot Shipping</b><small><svg class="g" width="14" height="14" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.4c-.5 2.9-2.2 5.3-4.6 6.9l7.1 5.5c4.3-4 6.8-9.9 6.8-16.9z"/><path fill="#FBBC05" d="M10.5 28.7c-.5-1.4-.8-2.9-.8-4.7s.3-3.2.8-4.7l-7.9-6.1C.9 16.5 0 20.1 0 24s.9 7.5 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.1-5.5c-2 1.4-4.6 2.3-8.8 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>Continue with Google · @pivotscl.com</small></span>
          <svg class="arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
        <button type="button" class="co rise r4" data-co="tmc">
          <span class="tile tmc"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/></svg></span>
          <span class="txt"><b>Pivot Travel Management</b><small><svg class="g" width="14" height="14" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.4c-.5 2.9-2.2 5.3-4.6 6.9l7.1 5.5c4.3-4 6.8-9.9 6.8-16.9z"/><path fill="#FBBC05" d="M10.5 28.7c-.5-1.4-.8-2.9-.8-4.7s.3-3.2.8-4.7l-7.9-6.1C.9 16.5 0 20.1 0 24s.9 7.5 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.1-5.5c-2 1.4-4.6 2.3-8.8 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>Continue with Google · @pivottmc.com</small></span>
          <svg class="arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
      </section>

      <!-- waiting: Google is open in the browser -->
      <section id="waiting" class="pane" hidden>
        <div class="handoff rise r1" aria-hidden="true">
          <span class="pc"><svg class="laptop" width="84" height="58" viewBox="0 0 84 58" aria-hidden="true"><defs><linearGradient id="scr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4aa6ec"/><stop offset="1" stop-color="#005fae"/></linearGradient></defs><rect class="bezel" x="13" y="3" width="58" height="40" rx="5"/><rect x="16.5" y="6.5" width="51" height="33" rx="2.5" fill="url(#scr)"/><g class="env"><rect x="32" y="14" width="20" height="14" rx="2.2" fill="#fff"/><path d="M33 15.2l9 6.6 9-6.6" fill="none" stroke="#0072c6" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></g><path class="deck" d="M3 45.5h78l-3.4 7.2a3 3 0 0 1-2.7 1.8H9.1a3 3 0 0 1-2.7-1.8z"/><rect class="notch" x="35" y="45.5" width="14" height="2.2" rx="1.1"/></svg><small>This computer</small></span>
          <span class="track"><i></i><i></i><i></i><i></i><i></i></span>
          <span class="goo"><span class="gcircle"><svg class="gbig" width="28" height="28" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.4c-.5 2.9-2.2 5.3-4.6 6.9l7.1 5.5c4.3-4 6.8-9.9 6.8-16.9z"/><path fill="#FBBC05" d="M10.5 28.7c-.5-1.4-.8-2.9-.8-4.7s.3-3.2.8-4.7l-7.9-6.1C.9 16.5 0 20.1 0 24s.9 7.5 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.1-5.5c-2 1.4-4.6 2.3-8.8 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg></span><small>Google</small></span>
        </div>
        <h1 class="rise r2">Continue in your browser</h1>
        <p class="lead rise r3">Choose your <b id="domain">@pivotscl.com</b> account in the Google page we opened. Pivot Mail opens here by itself.</p>
        <div class="actions rise r4">
          <button type="button" class="secondary" id="reopen">Open the browser again</button>
          <button type="button" class="link" id="back">Back</button>
        </div>
      </section>

      <!-- finishing: the hand-off arrived, the full window is being prepared -->
      <section id="finishing" class="pane" hidden>
        <div class="done rise r1" aria-hidden="true">
          <svg width="64" height="64" viewBox="0 0 64 64"><circle class="ring" cx="32" cy="32" r="28" fill="none" stroke-width="4"/><path class="tick" d="M21 33l8 8 15-17" fill="none" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <h1 class="rise r2">You're signed in</h1>
        <p class="lead rise r3">Opening your mail…</p>
        <div class="bar rise r4" aria-hidden="true"><span></span></div>
      </section>

      <footer>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
        <span>Encrypted · Internal use only</span><span class="ver" id="ver"></span>
      </footer>
    </main>
    <script src="signin.js"></script>
  </body>
</html>
