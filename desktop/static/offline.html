<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'self'; script-src 'self'" />
    <title>Pivot Mail</title>
    <link rel="stylesheet" href="offline.css" />
  </head>
  <body>
    <div class="bg" aria-hidden="true"><span class="glow g1"></span><span class="glow g2"></span><span class="glow g3"></span><span class="dots"></span></div>
    <main class="card" role="alert" aria-live="polite">
      <div class="hero" aria-hidden="true"><span class="glow g1"></span><span class="glow g2"></span><span class="dots"></span></div>
      <header class="brand">
        <span class="logo"><img src="../build/icon.png" width="64" height="64" alt="" /></span>
        <span class="word"><b>Pivot</b> Mail</span>
      </header>
      <section class="sheet">
        <div class="scene" aria-hidden="true">
          <span class="end"><svg class="laptop" width="84" height="58" viewBox="0 0 84 58" aria-hidden="true"><defs><linearGradient id="scr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4aa6ec"/><stop offset="1" stop-color="#005fae"/></linearGradient></defs><rect class="bezel" x="13" y="3" width="58" height="40" rx="5"/><rect x="16.5" y="6.5" width="51" height="33" rx="2.5" fill="url(#scr)"/><g class="env"><rect x="32" y="14" width="20" height="14" rx="2.2" fill="#fff"/><path d="M33 15.2l9 6.6 9-6.6" fill="none" stroke="#0072c6" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></g><path class="deck" d="M3 45.5h78l-3.4 7.2a3 3 0 0 1-2.7 1.8H9.1a3 3 0 0 1-2.7-1.8z"/><rect class="notch" x="35" y="45.5" width="14" height="2.2" rx="1.1"/></svg><small>This computer</small></span>
          <span class="link-line">
            <span class="track"><i></i><i></i><i></i><i></i><i></i><i></i></span>
            <span class="badge" id="badge"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17"/></svg></span>
          </span>
          <span class="end"><span class="farbox" id="far"><span class="warn" aria-hidden="true">!</span><svg class="far globe" width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a14 14 0 0 1 0 18a14 14 0 0 1 0-18z"/></svg><svg class="far server" width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3.5" width="16" height="7" rx="1.6"/><rect x="4" y="13.5" width="16" height="7" rx="1.6"/><path d="M8 7h.01M8 17h.01M12 7h5M12 17h5"/></svg></span><small id="far-label">Internet</small></span>
        </div>
        <h1 id="title">No internet connection</h1>
        <p class="lead" id="lead">Pivot Mail needs the internet to open. Check the Wi&#8209;Fi or network cable.</p>
        <p class="status"><span class="pulse" aria-hidden="true"></span><span id="status">Pivot Mail will open by itself as soon as it can connect.</span></p>
        <button type="button" id="retry">Try again now</button>
        <small class="code" id="code"></small>
      </section>
      <footer>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
        <span>Your stored mail is safe on this computer</span>
      </footer>
    </main>
    <script src="offline.js"></script>
  </body>
</html>
